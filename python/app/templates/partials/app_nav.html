<header class="h-16 shrink-0 border-b border-white/5 bg-[#070a0f]/85 glass px-3 sm:px-5 flex items-center justify-between sticky top-0 z-30">
  <div class="flex items-center gap-3 min-w-0">
    <button data-sidebar-open class="lg:hidden p-2 rounded-lg text-slate-400 hover:text-slate-100 hover:bg-white/5" aria-label="Open menu">
      <i data-lucide="menu" class="w-5 h-5"></i>
    </button>

    <a href="/" class="flex items-center gap-2.5 shrink-0" title="Back to AeroRoute AI home">
      <span class="w-9 h-9 rounded-xl bg-cyan-500/10 border border-cyan-400/30 flex items-center justify-center text-cyan-300">
        <i data-lucide="plane" class="w-4 h-4 -rotate-45"></i>
      </span>
      <span class="hidden xl:block font-display font-bold tracking-tight text-slate-100">AeroRoute <span class="text-cyan-400">AI</span></span>
    </a>

    <span class="hidden sm:block text-slate-700">/</span>
    <div class="hidden sm:flex items-center gap-1.5 text-sm min-w-0">
      <span class="text-slate-500">Console</span>
      <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-slate-600"></i>
      <span class="font-medium text-slate-200 truncate">{{ page_title }}</span>
    </div>
  </div>

  <div class="hidden 2xl:flex items-center gap-4 text-xs font-mono text-slate-400">
    <div class="flex items-center gap-1.5">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span class="text-emerald-400 font-medium">DATA READY</span>
    </div>
    <span class="text-slate-700">|</span>
    <div class="flex items-center gap-1.5"><i data-lucide="cpu" class="w-3.5 h-3.5 text-cyan-400"></i><span>DELAY SCORING</span></div>
    <span class="text-slate-700">|</span>
    <div class="flex items-center gap-1.5"><i data-lucide="activity" class="w-3.5 h-3.5 text-sky-400"></i><span>GRAPH ROUTING</span></div>
  </div>

  <div class="flex items-center gap-2 sm:gap-3">
    <div class="hidden lg:block text-right font-mono">
      <div data-utc-clock class="text-xs text-slate-200 tracking-wider"></div>
      <div class="text-[10px] text-slate-500">UTC · BUNDLED SNAPSHOTS</div>
    </div>
    <a href="/" class="hidden sm:inline-flex items-center gap-1.5 rounded-lg border border-white/10 bg-white/[0.03] hover:bg-white/[0.07] px-3 py-1.5 text-xs font-medium text-slate-300 transition-colors">
      <i data-lucide="home" class="w-3.5 h-3.5"></i>
      <span class="hidden md:inline">Website</span>
    </a>
    <div class="text-[11px] font-mono text-amber-300/90 bg-amber-500/10 border border-amber-500/25 px-2 py-1 rounded-lg flex items-center gap-1.5">
      <i data-lucide="shield-alert" class="w-3.5 h-3.5"></i>
      <span class="hidden sm:inline">PROTOTYPE</span>
    </div>
  </div>
</header>
